name: stablemanager

services:

  # ------------------------------------------------
  # Bootstrap
  #
  # Creates the Laravel skeleton in the host project
  # directory and copies the generated Composer lock
  # file into the project.
  #
  # IMPORTANT: The lock file is overwritten deliberately.
  # cp -n would preserve an outdated lock file.
  # ------------------------------------------------

  bootstrap:
    image: stablemanager-app:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command:
      - sh
      - -c
      - |
        cp -an /opt/laravel/. /workspace/
        cp -f /opt/stablemanager/composer.lock /workspace/composer.lock
        
        # Remove obsolete Laravel scaffold frontend files
        rm -f /workspace/vite.config.js
        rm -f /workspace/resources/js/app.js

        mkdir -p /workspace/storage/framework/cache \
                 /workspace/storage/framework/sessions \
                 /workspace/storage/framework/views \
                 /workspace/storage/logs \
                 /workspace/bootstrap/cache
    volumes:
      - .:/workspace
    restart: "no"

  # ------------------------------------------------
  # Laravel application
  # ------------------------------------------------

  app:
    image: stablemanager-app:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      # - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - node_modules_data:/var/www/html/node_modules
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command:
      - sh
      - -c
      - |
        composer validate --no-check-publish
        composer install --no-interaction --prefer-dist
        if ! grep -q '^APP_KEY=base64:' .env; then
          php artisan key:generate --force
        fi

        php artisan config:clear
        php artisan package:discover --ansi

        exec php-fpm
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php-fpm
        - -t
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  # ------------------------------------------------
  # Nginx
  # ------------------------------------------------

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      # - storage_data:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  # ------------------------------------------------
  # Vite development server
  # ------------------------------------------------

  vite:
    image: node:26-alpine
    working_dir: /var/www/html
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command:
      - sh
      - -c
      - |
        npm install --no-audit --no-fund
        npm run dev -- --config vite.config.ts --host 0.0.0.0
    networks:
      - backend

  # ------------------------------------------------
  # PostgreSQL
  # ------------------------------------------------

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-stablemanager}
      POSTGRES_USER: ${DB_USERNAME:-stablemanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stablemanager_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ------------------------------------------------
  # Redis
  # ------------------------------------------------

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # ------------------------------------------------
  # Queue worker
  # ------------------------------------------------

  queue:
    image: stablemanager-app:development
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      # - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      REDIS_HOST: redis
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=90
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  # ------------------------------------------------
  # Scheduler
  # ------------------------------------------------

  scheduler:
    image: stablemanager-app:development
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      # - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      REDIS_HOST: redis
    command:
      - php
      - artisan
      - schedule:work
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  # ------------------------------------------------
  # Mailpit
  # ------------------------------------------------

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend

  # ------------------------------------------------
  # pgAdmin
  # ------------------------------------------------

  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: stablemanager-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@stablemanager.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-stablemanager-dev}
    ports:
      - "127.0.0.1:${PGADMIN_LISTEN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  vendor_data:
  node_modules_data:
  # storage_data:
  bootstrap_cache:
  pgadmin_data: 
