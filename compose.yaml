name: stablemanager

services:
  bootstrap:
    image: stablemanager-app:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command:
      - sh
      - -c
      - |
        cp -an /opt/laravel/. /workspace/
        cp -n /opt/stablemanager/composer.lock /workspace/composer.lock || true
        mkdir -p /workspace/storage/framework/cache \
                 /workspace/storage/framework/sessions \
                 /workspace/storage/framework/views \
                 /workspace/storage/logs \
                 /workspace/bootstrap/cache
    volumes:
      - .:/workspace
    restart: "no"

  app:
    image: stablemanager-app:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command:
      - sh
      - -c
      - |
        composer install --no-interaction --prefer-dist
        if ! grep -q '^APP_KEY=base64:' .env; then
          php artisan key:generate --force
        fi
        exec php-fpm
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
        #- CMD-SHELL
        #- php -r '$$s=@fsockopen("127.0.0.1",9000); exit($$s ? 0 : 1);'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - storage_data:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  vite:
    image: node:26-alpine
    working_dir: /var/www/html
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command:
      - sh
      - -c
      - |
        npm install --no-audit --no-fund
        npm run dev -- --host 0.0.0.0
    networks:
      - backend

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-stablemanager}
      POSTGRES_USER: ${DB_USERNAME:-stablemanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stablemanager_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  queue:
    image: stablemanager-app:development
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      REDIS_HOST: redis
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=90
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  scheduler:
    image: stablemanager-app:development
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      REDIS_HOST: redis
    command:
      - php
      - artisan
      - schedule:work
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  vendor_data:
  node_modules_data:
  storage_data:
  bootstrap_cache:
